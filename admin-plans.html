<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paket & Harga — Admin JokiLaporan.id</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<nav class="navbar" style="position:sticky;z-index:100;border-bottom:1px solid var(--border-primary)">
  <div class="container" style="max-width:100%">
    <div class="navbar-inner">
      <a href="admin.html" class="navbar-logo">
        <div class="logo-icon" style="background:#000;color:var(--primary-light)"><i data-lucide="shield"></i></div>
        <span class="text-gradient">Admin Panel</span>
      </a>
      <div class="navbar-actions" style="display:flex;align-items:center;gap:1rem">
        <span class="badge badge-primary">Mode Admin</span>
        <button onclick="APP.logout()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="admin-layout">
  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-title">Menu Utama</div>
    <a href="admin.html" class="admin-nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="admin-schools.html" class="admin-nav-item"><i data-lucide="school"></i> Data Sekolah & Jurusan</a>
    <a href="admin-templates.html" class="admin-nav-item"><i data-lucide="layout-template"></i> Engine Template</a>
    
    <div class="admin-sidebar-title" style="margin-top:1.5rem">Penjualan & User</div>
    <a href="admin-plans.html" class="admin-nav-item active"><i data-lucide="credit-card"></i> Paket & Harga</a>
    <a href="admin-users.html" class="admin-nav-item"><i data-lucide="users"></i> Pengguna</a>
  </aside>
  
  <!-- CONTENT -->
  <main class="admin-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem">
      <div>
        <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:0.25rem">Paket & Harga</h1>
        <p style="color:var(--text-secondary)">Kelola batas fitur dan harga untuk setiap paket</p>
      </div>
    </div>

    <div class="grid-3" id="plans-container">
      <!-- Rendered by JS -->
    </div>
  </main>
</div>

<!-- Modal Edit Plan -->
<div class="modal-overlay" id="modalPlan">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title"><i data-lucide="credit-card"></i> Edit Paket <span id="modal-plan-name"></span></h3>
      <button class="modal-close" onclick="closeModal('modalPlan')">×</button>
    </div>
    <form id="form-plan" onsubmit="savePlan(event)">
      <input type="hidden" id="plan-id">
      
      <div class="form-row" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Nama Paket</label>
          <input type="text" id="plan-name" class="form-input" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">Harga (Rp)</label>
          <input type="number" id="plan-price" class="form-input" required>
        </div>
      </div>
      
      <div class="form-row" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Maksimal Laporan</label>
          <input type="number" id="plan-max-reports" class="form-input" placeholder="-1 untuk unlimited" required>
        </div>
        <div class="form-group">
          <label class="form-label">Maksimal Kegiatan</label>
          <input type="number" id="plan-max-act" class="form-input" placeholder="-1 untuk unlimited" required>
        </div>
      </div>
      
      <div class="form-row" style="margin-bottom:1.5rem">
        <div class="form-group" style="flex-direction:row;align-items:center;gap:0.5rem">
          <input type="checkbox" id="plan-can-docx" style="width:18px;height:18px">
          <label class="form-label" style="margin:0">Izinkan DOCX</label>
        </div>
        <div class="form-group" style="flex-direction:row;align-items:center;gap:0.5rem">
          <input type="checkbox" id="plan-no-wm" style="width:18px;height:18px">
          <label class="form-label" style="margin:0">Tanpa Watermark</label>
        </div>
      </div>
      
      <div style="display:flex;justify-content:flex-end;gap:0.75rem">
        <button type="button" class="btn btn-outline" onclick="closeModal('modalPlan')">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
      </div>
    </form>
  </div>
</div>

<script src="scripts/app.js"></script>
<script src="scripts/db.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!APP.getUser() || (APP.getUser().role !== 'admin' && APP.getUser().role !== 'superadmin')) {
    window.location.href = 'index.html';
    return;
  }
  
  loadPlans();
  if (typeof lucide !== 'undefined') lucide.createIcons();
});

function loadPlans() {
  const plans = DB.plans.getAll();
  const container = document.getElementById('plans-container');
  
  container.innerHTML = plans.map(p => {
    const isFree = p.id === 'free';
    const isPro = p.id === 'pro';
    
    return `
    <div class="card" style="${isPro ? 'border-color:var(--primary);box-shadow:var(--shadow-primary)' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
        <div>
          <h2 style="font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:0.5rem">
            ${isPro ? '<i data-lucide="star" style="color:var(--primary-light)"></i>' : 
              isFree ? '<i data-lucide="file"></i>' : '<i data-lucide="crown" style="color:#fcd34d"></i>'}
            ${p.name}
          </h2>
          <div style="font-size:1.5rem;font-weight:700;color:var(--primary-light);margin-top:0.5rem">${p.priceStr}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="editPlan('${p.id}')"><i data-lucide="edit"></i> Edit</button>
      </div>
      
      <div class="divider"></div>
      
      <ul style="list-style:none;display:flex;flex-direction:column;gap:0.5rem;font-size:0.9rem">
        <li style="display:flex;align-items:center;gap:0.5rem">
          <i data-lucide="file-text" style="width:16px;height:16px;color:var(--text-secondary)"></i>
          <span>Maks. Laporan: <strong>${p.maxReports === -1 ? 'Tak Terbatas' : p.maxReports}</strong></span>
        </li>
        <li style="display:flex;align-items:center;gap:0.5rem">
          <i data-lucide="activity" style="width:16px;height:16px;color:var(--text-secondary)"></i>
          <span>Maks. Kegiatan: <strong>${p.maxActivities === -1 ? 'Tak Terbatas' : p.maxActivities}</strong></span>
        </li>
        <li style="display:flex;align-items:center;gap:0.5rem">
          <i data-lucide="${p.canDocx ? 'check-circle-2' : 'x-circle'}" style="width:16px;height:16px;color:${p.canDocx ? '#86efac' : '#fca5a5'}"></i>
          <span>Export DOCX</span>
        </li>
        <li style="display:flex;align-items:center;gap:0.5rem">
          <i data-lucide="${p.canPdfNoWatermark ? 'check-circle-2' : 'x-circle'}" style="width:16px;height:16px;color:${p.canPdfNoWatermark ? '#86efac' : '#fca5a5'}"></i>
          <span>Tanpa Watermark</span>
        </li>
      </ul>
    </div>
  `}).join('');
  
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function editPlan(id) {
  const p = DB.plans.getById(id);
  if(!p) return;
  
  document.getElementById('modal-plan-name').textContent = p.name;
  document.getElementById('plan-id').value = p.id;
  document.getElementById('plan-name').value = p.name;
  document.getElementById('plan-price').value = p.price;
  document.getElementById('plan-max-reports').value = p.maxReports;
  document.getElementById('plan-max-act').value = p.maxActivities;
  document.getElementById('plan-can-docx').checked = p.canDocx;
  document.getElementById('plan-no-wm').checked = p.canPdfNoWatermark;
  
  // Free plan logic lockdown
  if(id === 'free') {
    document.getElementById('plan-price').disabled = true;
    document.getElementById('plan-can-docx').disabled = true;
    document.getElementById('plan-no-wm').disabled = true;
  } else {
    document.getElementById('plan-price').disabled = false;
    document.getElementById('plan-can-docx').disabled = false;
    document.getElementById('plan-no-wm').disabled = false;
  }
  
  openModal('modalPlan');
}

function savePlan(e) {
  e.preventDefault();
  const id = document.getElementById('plan-id').value;
  
  const price = parseInt(document.getElementById('plan-price').value);
  const data = {
    price: price,
    priceStr: price === 0 ? 'Gratis' : APP.formatCurrency(price),
    maxReports: parseInt(document.getElementById('plan-max-reports').value),
    maxActivities: parseInt(document.getElementById('plan-max-act').value),
    canDocx: document.getElementById('plan-can-docx').checked,
    canPdfNoWatermark: document.getElementById('plan-no-wm').checked
  };
  
  DB.plans.update(id, data);
  APP.notify('Paket berhasil diperbarui', 'success');
  closeModal('modalPlan');
  loadPlans();
}
</script>
</body>
</html>
