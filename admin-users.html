<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengguna — Admin JokiLaporan.id</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<nav class="navbar" style="position:sticky;z-index:100;border-bottom:1px solid var(--border-primary)">
  <div class="container" style="max-width:100%">
    <div class="navbar-inner">
      <a href="admin.html" class="navbar-logo">
        <div class="logo-icon" style="background:#000;color:var(--primary-light)"><i data-lucide="shield"></i></div>
        <span class="text-gradient">Admin Panel</span>
      </a>
      <div class="navbar-actions" style="display:flex;align-items:center;gap:1rem">
        <span class="badge badge-primary">Mode Admin</span>
        <button onclick="APP.logout()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="admin-layout">
  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-title">Menu Utama</div>
    <a href="admin.html" class="admin-nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="admin-schools.html" class="admin-nav-item"><i data-lucide="school"></i> Data Sekolah & Jurusan</a>
    <a href="admin-templates.html" class="admin-nav-item"><i data-lucide="layout-template"></i> Engine Template</a>
    
    <div class="admin-sidebar-title" style="margin-top:1.5rem">Penjualan & User</div>
    <a href="admin-plans.html" class="admin-nav-item"><i data-lucide="credit-card"></i> Paket & Harga</a>
    <a href="admin-users.html" class="admin-nav-item active"><i data-lucide="users"></i> Pengguna</a>
  </aside>
  
  <!-- CONTENT -->
  <main class="admin-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem">
      <div>
        <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:0.25rem">Data Pengguna</h1>
        <p style="color:var(--text-secondary)">Kelola data siswa dan role pengguna</p>
      </div>
      <div>
        <div class="form-group" style="margin:0">
          <div style="position:relative">
            <i data-lucide="search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)"></i>
            <input type="text" class="form-input" placeholder="Cari email/nama..." style="padding-left:36px;width:250px" oninput="filterUsers(this.value)">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nama Lengkap</th>
              <th>Email</th>
              <th>Paket</th>
              <th>Role</th>
              <th>Terdaftar</th>
              <th style="text-align:right">Aksi</th>
            </tr>
          </thead>
          <tbody id="user-list">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal Edit User -->
<div class="modal-overlay" id="modalUser">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title"><i data-lucide="user"></i> Edit Pengguna</h3>
      <button class="modal-close" onclick="closeModal('modalUser')">×</button>
    </div>
    <form id="form-user" onsubmit="saveUser(event)">
      <input type="hidden" id="user-id">
      
      <div class="form-group" style="margin-bottom:1rem">
        <label class="form-label">Email</label>
        <input type="email" id="user-email" class="form-input" disabled>
      </div>
      
      <div class="form-group" style="margin-bottom:1rem">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" id="user-name" class="form-input" required>
      </div>
      
      <div class="form-row" style="margin-bottom:1.5rem">
        <div class="form-group">
          <label class="form-label">Role</label>
          <select id="user-role" class="form-select">
            <option value="student">Siswa (Student)</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Paket Saat Ini</label>
          <select id="user-plan" class="form-select">
            <option value="free">Gratis</option>
            <option value="pro">Pro</option>
            <option value="premium">Premium</option>
          </select>
        </div>
      </div>
      
      <div style="display:flex;justify-content:flex-end;gap:0.75rem">
        <button type="button" class="btn btn-outline" onclick="closeModal('modalUser')">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
      </div>
    </form>
  </div>
</div>

<script src="scripts/app.js"></script>
<script>
let allUsers = [];

document.addEventListener('DOMContentLoaded', () => {
  if (!APP.getUser() || (APP.getUser().role !== 'admin' && APP.getUser().role !== 'superadmin')) {
    window.location.href = 'index.html';
    return;
  }
  
  loadUsers();
  if (typeof lucide !== 'undefined') lucide.createIcons();
});

function loadUsers() {
  allUsers = APP.storage.get(APP.KEYS?.users || 'joki_users') || [];
  renderUserTable(allUsers);
}

function filterUsers(query) {
  const q = query.toLowerCase();
  const filtered = allUsers.filter(u => 
    u.name.toLowerCase().includes(q) || 
    u.email.toLowerCase().includes(q)
  );
  renderUserTable(filtered);
}

function renderUserTable(users) {
  const tbody = document.getElementById('user-list');
  
  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Tidak ada pengguna ditemukan</td></tr>';
    return;
  }
  
  tbody.innerHTML = users.map(u => {
    const isSuper = u.role === 'superadmin';
    return `
    <tr>
      <td style="font-weight:600">${u.name}</td>
      <td>${u.email}</td>
      <td>
        <span class="badge ${u.plan === 'pro' ? 'badge-primary' : u.plan === 'premium' ? 'badge-warning' : 'badge-neutral'}">
          ${u.plan.toUpperCase()}
        </span>
      </td>
      <td>${isSuper ? '<span class="text-gradient font-bold">Super Admin</span>' : u.role === 'admin' ? 'Admin' : 'Siswa'}</td>
      <td style="font-size:0.85rem;color:var(--text-muted)">${APP.formatDateShort(u.createdAt)}</td>
      <td style="text-align:right">
        ${isSuper ? '' : `<button class="btn btn-ghost btn-sm" onclick="editUser('${u.id}')"><i data-lucide="edit"></i> Edit</button>`}
      </td>
    </tr>
  `}).join('');
  
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function editUser(id) {
  const u = allUsers.find(x => x.id === id);
  if (!u) return;
  
  document.getElementById('user-id').value = u.id;
  document.getElementById('user-email').value = u.email;
  document.getElementById('user-name').value = u.name;
  document.getElementById('user-role').value = u.role || 'student';
  document.getElementById('user-plan').value = u.plan || 'free';
  
  openModal('modalUser');
}

function saveUser(e) {
  e.preventDefault();
  const id = document.getElementById('user-id').value;
  
  const idx = allUsers.findIndex(x => x.id === id);
  if (idx !== -1) {
    allUsers[idx].name = document.getElementById('user-name').value;
    allUsers[idx].role = document.getElementById('user-role').value;
    allUsers[idx].plan = document.getElementById('user-plan').value;
    
    APP.storage.set(APP.KEYS?.users || 'joki_users', allUsers);
    
    // Update active session if editing self
    const currentUser = APP.getUser();
    if (currentUser && currentUser.id === id) {
      APP.updateUser({
        name: allUsers[idx].name,
        role: allUsers[idx].role,
        plan: allUsers[idx].plan
      });
    }
    
    APP.notify('Data pengguna diperbarui', 'success');
  }
  
  closeModal('modalUser');
  loadUsers();
}
</script>
</body>
</html>
