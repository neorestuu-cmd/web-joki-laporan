<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaim Reward — JokiLaporan.id</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background:var(--bg-default)">

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <div class="logo-icon"><i data-lucide="file-text"></i></div>
        <span class="text-gradient">JokiLaporan</span><span style="color:var(--text-secondary)">.id</span>
      </a>
    </div>
  </div>
</nav>

<div class="container" style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem 0">
  
  <div class="card" style="width:100%;max-width:500px;text-align:center;padding:2.5rem 2rem;position:relative;overflow:hidden">
    
    <!-- Background element -->
    <div style="position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:var(--primary);filter:blur(80px);opacity:0.2;z-index:0"></div>
    
    <div style="position:relative;z-index:1">
      <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:0.5rem">Tunggu Sebentar...</h1>
      <p style="color:var(--text-secondary);font-size:0.95rem;margin-bottom:2rem">Laporanmu sedang disiapkan. Tonton pesan sponsor berikut ini untuk membuka fitur.</p>
      
      <!-- Video/Ad Simulation Area -->
      <div style="width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius-lg);margin-bottom:2rem;position:relative;overflow:hidden;border:1px solid var(--border-strong)">
        
        <!-- Ad Video (Simulated using text + CSS animation) -->
        <div id="ad-content" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(45deg, #1e1e1e, #2d2d2d);">
          <div style="font-size:2.5rem;margin-bottom:1rem">☕</div>
          <div style="font-size:1.2rem;font-weight:700;color:white;margin-bottom:0.5rem">Ngopi Dulu Bang!</div>
          <div style="font-size:0.85rem;color:#aaa">Sedang memproses dokumenmu...</div>
        </div>
        
        <!-- Timer Overlay -->
        <div style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);color:white;padding:4px 10px;border-radius:20px;font-size:0.8rem;font-weight:600;display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px)">
          <i data-lucide="clock" style="width:12px;height:12px"></i>
          <span id="reward-timer">15</span> dtk
        </div>
        
        <!-- Skip Button Overlay -->
        <button id="btn-skip" class="btn btn-sm" style="position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.4);display:none;backdrop-filter:blur(4px)">Lewati Ad >></button>
      </div>
      
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1.5rem">
        <i data-lucide="info" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:4px"></i>
        Kamu menggunakan paket <strong>Gratis</strong>. <a href="index.html#pricing" style="color:var(--primary-light)">Upgrade ke Pro</a> untuk proses instan tanpa iklan.
      </div>
      
      <!-- Progress Bar -->
      <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:1.5rem">
        <div id="reward-progress" style="height:100%;width:0%;background:var(--grad-primary);transition:width 1s linear"></div>
      </div>
      
      <button id="btn-claim" class="btn btn-primary btn-lg btn-full" disabled style="opacity:0.5">Membuka Dokumen...</button>
    </div>
  </div>
  
</div>

<script src="scripts/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('orderId');
  
  if (!orderId) {
    window.location.href = 'dashboard.html';
    return;
  }
  
  if (typeof lucide !== 'undefined') lucide.createIcons();
  
  // Timer config
  const TOTAL_SECONDS = 15;
  let remaining = TOTAL_SECONDS;
  const timerEl = document.getElementById('reward-timer');
  const progEl = document.getElementById('reward-progress');
  const btnClaim = document.getElementById('btn-claim');
  const btnSkip = document.getElementById('btn-skip');
  
  // Start simulation
  const interval = setInterval(() => {
    remaining--;
    timerEl.textContent = remaining;
    
    const pct = ((TOTAL_SECONDS - remaining) / TOTAL_SECONDS) * 100;
    progEl.style.width = pct + '%';
    
    // Show skip button halfway
    if (remaining === Math.floor(TOTAL_SECONDS / 2)) {
      btnSkip.style.display = 'block';
    }
    
    if (remaining <= 0) {
      clearInterval(interval);
      finishReward(orderId);
    }
  }, 1000);
  
  // Skip button click
  btnSkip.addEventListener('click', () => {
    clearInterval(interval);
    progEl.style.width = '100%';
    finishReward(orderId);
  });
});

function finishReward(orderId) {
  const timerOverlay = document.getElementById('reward-timer').parentElement;
  timerOverlay.style.display = 'none';
  
  const skipBtn = document.getElementById('btn-skip');
  skipBtn.style.display = 'none';
  
  const content = document.getElementById('ad-content');
  content.innerHTML = `
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,0.2);color:#86efac;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;box-shadow:0 0 20px rgba(34,197,94,0.3)">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div style="font-size:1.2rem;font-weight:700;color:white">Berhasil!</div>
  `;
  
  const btnClaim = document.getElementById('btn-claim');
  btnClaim.disabled = false;
  btnClaim.style.opacity = '1';
  btnClaim.innerHTML = '<i data-lucide="unlock"></i> Buka Laporan Sekarang';
  
  // Create reward token
  const tokens = APP.storage.get(APP.KEYS?.rewardTokens || 'joki_reward_tokens') || [];
  // Token valid for 24h
  const expiresAt = new Date();
  expiresAt.setHours(expiresAt.getHours() + 24);
  
  tokens.push({
    id: 'rew_' + Math.random().toString(36).substr(2, 9),
    orderId: orderId,
    type: 'pdf',
    createdAt: new Date().toISOString(),
    expiresAt: expiresAt.toISOString(),
    used: false
  });
  
  APP.storage.set(APP.KEYS?.rewardTokens || 'joki_reward_tokens', tokens);
  
  // Update order status if necessary
  
  if (typeof lucide !== 'undefined') lucide.createIcons();
  
  btnClaim.addEventListener('click', () => {
    window.location.href = `result.html?id=${orderId}`;
  });
  
  // Auto redirect after 3s
  setTimeout(() => {
    window.location.href = `result.html?id=${orderId}`;
  }, 3000);
}
</script>
</body>
</html>
